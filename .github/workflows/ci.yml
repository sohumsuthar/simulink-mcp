name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: build & import (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install .
      # MATLAB Engine is intentionally not a declared dep — it's user-installed.
      # The package must still import cleanly without it (lazy engine startup).
      - run: python -c "import simulink_mcp; assert callable(simulink_mcp.main)"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Critical rules only: syntax errors, undefined names, broken comparisons.
      # Style rules are deliberately excluded to avoid churning the codebase.
      - run: ruff check --select=E9,F63,F7,F82 simulink_mcp

  package:
    name: package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
